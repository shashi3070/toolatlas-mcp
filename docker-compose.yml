services:
  toolatlas:
    build: .
    container_name: toolatlas
    ports:
      - "8081:8081"
    volumes:
      - toolatlas_data:/data
    command: ["start", "--host", "0.0.0.0", "--port", "8081", "--storage", "json", "--data-dir", "/data"]
    environment:
      TOOLATLAS_HOST: "0.0.0.0"
      TOOLATLAS_PORT: "8081"
      TOOLATLAS_STORAGE_TYPE: "json"
      TOOLATLAS_DATABASE_URL: "sqlite+aiosqlite:////data/toolatlas.db"
      TOOLATLAS_LOG_LEVEL: "INFO"
      TOOLATLAS_TOP_TABS: "true"
      TOOLATLAS_PRIMARY_COLOR: "#6832ba"
      TOOLATLAS_DATA_DIR: "/data"
    restart: unless-stopped

volumes:
  toolatlas_data:
